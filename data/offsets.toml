# oops-sdk Kernel Offsets Configuration
# Externalized runtime offsets for Orbis & Prospero firmwares.
#
# Provenance: SharpProspero / PS5SDK / FreeBSD 9.0/11.0 kernel headers.
# This file allows supporting new firmware versions at runtime without recompiling.

[common]
# Process (struct proc) field offsets
p_ucred          = 0x40
p_fd             = 0x48
p_pid            = 0xBC
p_titleid        = 0x470
p_comm           = 0x5DC

# File descriptor (struct filedesc) field offsets
fd_rdir          = 0x10
fd_jdir          = 0x18

# Credentials (struct ucred) field offsets
cr_uid           = 0x04
cr_ruid          = 0x08
cr_svuid         = 0x0C
cr_ngroups       = 0x10
cr_rgid          = 0x14
cr_svgid         = 0x18
cr_prison        = 0x30
cr_sceauthid     = 0x58
cr_scecaps       = 0x60
cr_sceattrs      = 0x80
cr_sceattr0      = 0x83

# Prison (struct prison) field offsets
pr_ref           = 0x14

