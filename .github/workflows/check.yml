name: check

# Checks out the collection, this repository inside it, and bootstraps the siblings this
# project needs (none; the step keeps every workflow the same shape). See docs/BUILDING.md.
# oops-sdk is linked into what obSCEne and the apps ship.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: index, formatting, build at -Werror, host suite
    runs-on: ubuntu-latest
    # The clang 21 pin from `toolchain.mk`; Ubuntu's own `clang` package is an older major.
    container: silkeh/clang:21
    steps:
      # Before `actions/checkout`, which without git falls back to a download with no history.
      - name: Tools the container does not ship
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates
          # The workspace belongs to the runner user, not the container's root.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-sdk

      - name: The compiler this build is pinned to
        run: clang --version | head -1

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap oops-sdk
        env:
          # Empty unless the org secret exists.
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      # First, so a stale index or a layout diff fails in seconds; `check` below runs both
      # again.
      - name: API index
        run: tools/api-index.sh --check
        working-directory: OOPS/oops-sdk
      - name: Formatting
        run: ./bin/oops-sdk fmt --check
        working-directory: OOPS/oops-sdk

      - name: Build and host suite
        run: ./bin/oops-sdk check
        working-directory: OOPS/oops-sdk
