name: Deploy docs to GitHub Pages

# Publishes the documentation and nothing else, as oops-libs does; `/` redirects to it.
#
# `paths-ignore` rather than a `paths` allowlist: an allowlist that misses a docs path leaves
# the site publishing stale pages, so only what cannot change the site is named.

on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE-*"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site bundle
    # GitHub Pages does not serve a private repository on a free plan, so the build runs only
    # while the repository is public. The four project repositories carry the same gate.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      # The standard OOPS preamble; see docs/BUILDING.md.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/oops-sdk

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap oops-sdk
        env:
          # Empty unless the org secret exists; bootstrap works without it.
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      - name: Assemble bundle
        run: |
          set -euo pipefail
          mkdir -p site
          # The collection's shared renderer. Grey rather than a project accent, since
          # oops-sdk is not one of the four projects.
          bash ../tools/build-docs.sh . site "#8b9096" "oops-sdk"
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=docs/">
          <title>oops-sdk</title>
          <a href="docs/">oops-sdk documentation</a>
          HTML
          du -sh site
        working-directory: OOPS/oops-sdk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: OOPS/oops-sdk/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
